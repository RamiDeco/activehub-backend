server:
  port: ${PORT:8080}

spring:
  application:
    name: activehub-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/activehub?user=activehub&password=activehub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
  servlet:
    multipart:
      # El limite por archivo tiene que coincidir con el que promete la UI de registro
      # ("PDF, JPG o PNG · hasta 5 MB"). Con el default de Spring (1 MB) un adjunto valido
      # segun la pantalla era rechazado por el servidor.
      max-file-size: 5MB
      max-request-size: 30MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration-min: ${JWT_EXPIRATION_MIN:120}
  admin-seed:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
