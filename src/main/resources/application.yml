server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:./.env[.properties]
    application:
      name: activehub-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/activehub}
    username: ${DATABASE_USERNAME:activehub}
    password: ${DATABASE_PASSWORD:XXX}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      max-lifetime: 1500000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
  # Gmail SMTP. Con `MAIL_USERNAME` vacio el starter igual levanta y `EmailSender` cae al modo
  # "log" (ver su javadoc): sin esto, un checkout sin credenciales no podria ni registrar a
  # nadie. La contraseña es una **contraseña de aplicacion** de Google, no la de la cuenta.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # Sin timeouts, un SMTP que no responde cuelga el request de registro hasta el timeout
      # del socket del sistema operativo.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      # El limite por archivo tiene que coincidir con el que promete la UI de registro
      # ("PDF, JPG o PNG · hasta 5 MB"). Con el default de Spring (1 MB) un adjunto valido
      # segun la pantalla era rechazado por el servidor.
      max-file-size: 5MB
      max-request-size: 30MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    # E1A-HU02 criterio 3: "la sesion expira automaticamente por inactividad". El TTL del
    # token ES la ventana de inactividad: el frontend lo renueva contra /api/auth/refresh
    # mientras el usuario usa la app, asi que solo vence si deja de usarla. Bajarlo de 120
    # a 30 min es lo que hace que la expiracion sea por inactividad y no por antiguedad.
    expiration-min: ${JWT_EXPIRATION_MIN:30}
  admin-seed:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    # De dónde sale el "From". Por defecto la propia cuenta de Gmail: **Gmail reescribe el
    # remitente a la cuenta autenticada**, así que poner otra dirección acá no sirve de nada.
    from: ${MAIL_FROM:${spring.mail.username:}}
    from-nombre: ${MAIL_FROM_NOMBRE:ActiveHub}
  verificacion-email:
    # Ventana de validez del código. 15 min alcanza para ir al correo y volver, y deja corta
    # la ventana en la que un código filtrado sirve para algo.
    ttl-min: ${VERIFICACION_TTL_MIN:15}
    # Reenvíos: mínimo entre dos envíos al mismo usuario, para no convertir el endpoint en un
    # generador de spam contra un correo ajeno.
    espera-reenvio-seg: ${VERIFICACION_ESPERA_REENVIO_SEG:60}
    # Intentos fallidos antes de invalidar el código. Sin esto, 6 dígitos son 10^6
    # combinaciones que un script prueba en minutos.
    max-intentos: ${VERIFICACION_MAX_INTENTOS:5}
  google:
    # Client ID de la app web en Google Cloud Console. Vacío = "Continuar con Google"
    # deshabilitado (el endpoint responde 400 y el frontend no muestra el botón).
    client-id: ${GOOGLE_CLIENT_ID:}
  storage:
    documentos-instructor-dir: ${DOCUMENTOS_INSTRUCTOR_DIR:./uploads/documentos-instructor}
    fotos-perfil-dir: ${FOTOS_PERFIL_DIR:./uploads/fotos-perfil}
    fotos-actividad-dir: ${FOTOS_ACTIVIDAD_DIR:./uploads/fotos-actividad}
    # Supabase Storage. Con url y service-key cargadas, los archivos van al bucket y los
    # directorios de arriba quedan sin uso; vacias, se sigue escribiendo en disco. No hay
    # ningun flag de modo a proposito: ver AlmacenamientoConfig.
    # SUPABASE_STORAGE_SERVICE_KEY es la service_role key del proyecto, que saltea RLS: va
    # solo en el backend, nunca en el frontend ni versionada.
    supabase:
      url: ${SUPABASE_STORAGE_URL:}
      service-key: ${SUPABASE_STORAGE_SERVICE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:activehub}
